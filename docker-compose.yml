# Local Postgres for development: `npm run db:up`
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mice
      POSTGRES_PASSWORD: mystics
      POSTGRES_DB: mice_mystics
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
